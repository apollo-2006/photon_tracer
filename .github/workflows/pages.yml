name: demo

# Builds the WebAssembly demo from this commit's sources and publishes it to
# GitHub Pages, so the live demo always runs the code in the repository.
on:
  push:
    branches: [main]
    paths: ['src/**', 'include/**', 'web/**', 'Makefile', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned, like the Emscripten release below, so a runner image change
    # (ubuntu-latest moves to Ubuntu 26 in October 2026) cannot change the
    # build without a commit here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the native renderer
        run: make
      - uses: mymindstorm/setup-emsdk@v16
        with:
          # The Emscripten release the demo was built and tested with.
          version: 6.0.9
      - name: Build demo
        run: web/build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
